name: Phase 1 runtime QA

on:
  workflow_dispatch:
    inputs:
      deployed_sha:
        description: Full commit SHA already deployed to the QA VMs
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: phase1-runtime-qa
  cancel-in-progress: false

jobs:
  runtime-qa:
    name: Validate deployed Phase 1 SHA
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: qa
    env:
      DEPLOYED_SHA: ${{ inputs.deployed_sha }}
      WORKFLOW_SHA: ${{ github.sha }}
      WEB_BASE_URL: ${{ secrets.WEB_BASE_URL }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_RESTRICTED_EMAIL: ${{ secrets.E2E_RESTRICTED_EMAIL }}
      E2E_RESTRICTED_PASSWORD: ${{ secrets.E2E_RESTRICTED_PASSWORD }}
      E2E_TENANT_A_EMAIL: ${{ secrets.E2E_TENANT_A_EMAIL }}
      E2E_TENANT_A_PASSWORD: ${{ secrets.E2E_TENANT_A_PASSWORD }}
      E2E_TENANT_A_ID: ${{ secrets.E2E_TENANT_A_ID }}
      E2E_TENANT_B_EMAIL: ${{ secrets.E2E_TENANT_B_EMAIL }}
      E2E_TENANT_B_PASSWORD: ${{ secrets.E2E_TENANT_B_PASSWORD }}
      E2E_TENANT_B_ID: ${{ secrets.E2E_TENANT_B_ID }}
      E2E_REVIEWER_EMAIL: ${{ secrets.E2E_REVIEWER_EMAIL }}
      E2E_REVIEWER_PASSWORD: ${{ secrets.E2E_REVIEWER_PASSWORD }}
      E2E_REVIEWER_ID: ${{ secrets.E2E_REVIEWER_ID }}
      E2E_AUDIT_ID: ${{ secrets.E2E_AUDIT_ID }}
      E2E_EVIDENCE_ID: ${{ secrets.E2E_EVIDENCE_ID }}
      E2E_CONTROL_ID: ${{ secrets.E2E_CONTROL_ID }}
      PHASE1_QA_ENV: qa
      PHASE1_TENANT_ID: ${{ secrets.E2E_TENANT_A_ID }}
      PHASE1_PLATFORM_TOKEN: ${{ secrets.PHASE1_PLATFORM_TOKEN }}
      PHASE1_API_TOKEN: ${{ secrets.PHASE1_API_TOKEN }}
      PHASE1_API_BASE_URL: ${{ secrets.API_BASE_URL }}
      PHASE1_QA_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      PHASE1_QA_MANIFEST: artifacts/fase-1/phase1-qa-manifest.json
      DATABASE_URL: ${{ secrets.PHASE1_QA_DATABASE_URL }}

    steps:
      - name: Checkout main workflow SHA
        uses: actions/checkout@v6

      - name: Verify deployed SHA and QA configuration
        shell: bash
        run: |
          if [[ ! "$DEPLOYED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::deployed_sha must be a full 40-character commit SHA"
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Phase 1 runtime QA must be dispatched from main"
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$WORKFLOW_SHA" || "$actual_sha" != "$DEPLOYED_SHA" ]]; then
            echo "::error::main workflow SHA, checked out SHA and deployed_sha must match"
            exit 1
          fi
          required=(
            WEB_BASE_URL API_BASE_URL E2E_ADMIN_EMAIL E2E_ADMIN_PASSWORD
            E2E_RESTRICTED_EMAIL E2E_RESTRICTED_PASSWORD
            E2E_TENANT_A_EMAIL E2E_TENANT_A_PASSWORD E2E_TENANT_A_ID
            E2E_TENANT_B_EMAIL E2E_TENANT_B_PASSWORD E2E_TENANT_B_ID
            E2E_REVIEWER_EMAIL E2E_REVIEWER_PASSWORD E2E_REVIEWER_ID
            E2E_AUDIT_ID E2E_EVIDENCE_ID E2E_CONTROL_ID
            PHASE1_TENANT_ID PHASE1_PLATFORM_TOKEN PHASE1_API_TOKEN DATABASE_URL
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing required QA secrets: %s\n' "${missing[*]}"
            exit 1
          fi
          echo "Phase 1 runtime configuration verified for SHA $actual_sha"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Chromium
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: Enable Phase 1 module for QA tenant
        env:
          PHASE1_QA_CONFIRM: PREPARE_PHASE1_QA
        run: node scripts/phase1/prepare-phase1-runtime-qa.js

      - name: Bootstrap Phase 1 tenant configuration
        env:
          PHASE1_QA_CONFIRM: PREPARE_PHASE1_QA
          PHASE1_IDEMPOTENCY_KEY: runtime-${{ inputs.deployed_sha }}-${{ github.run_attempt }}
        run: node scripts/phase1/bootstrap-tenant-grc.js

      - name: Seed controlled Phase 1 QA records
        env:
          PHASE1_QA_CONFIRM: PREPARE_PHASE1_QA
        run: node scripts/phase1/seed-phase1-qa.js

      - name: Validate deployed Phase 1 runtime
        run: npm run phase1:runtime-check

      - name: Derive runtime evidence from passing Playwright results
        run: node scripts/phase1/write-phase1-runtime-evidence.js

      - name: Clean controlled Phase 1 QA records
        if: ${{ always() }}
        env:
          PHASE1_QA_CONFIRM: CLEAN_PHASE1_QA
        run: node scripts/phase1/cleanup-phase1-qa.js

      - name: Upload Phase 1 runtime evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: phase1-runtime-evidence-${{ inputs.deployed_sha }}
          if-no-files-found: error
          path: |
            artifacts/fase-1/phase1-contracts-check.json
            artifacts/fase-1/phase1-permissions-check.json
            artifacts/fase-1/phase1-tenant-check.json
            artifacts/fase-1/e2e-results.json
            artifacts/fase-1/phase1-runtime-summary.json
            artifacts/fase-1/phase1-api-results.json
            artifacts/fase-1/phase1-export-validation.json
            artifacts/fase-1/phase1-tenant-isolation.json
            artifacts/fase-1/phase1-observability.txt
            artifacts/fase-1/phase1-scheduler-results.json
            artifacts/fase-1/phase1-closeout-evidence.md
            artifacts/fase-1/phase1-qa-manifest.json
            frontend/test-results/
            artifacts/fase-1/phase1-playwright-report/
