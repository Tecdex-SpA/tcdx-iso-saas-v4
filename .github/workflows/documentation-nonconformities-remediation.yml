name: Documentation nonconformities remediation

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/documentation-nonconformities-remediation.yml'
      - 'frontend/tests/e2e/documentation-nonconformities-remediation.spec.ts'
      - 'frontend/playwright.documentation-capture.config.ts'

permissions:
  contents: read

concurrency:
  group: documentation-nonconformities-remediation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nonconformities:
    name: Create guarded DOC NC and remediation flow
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: documentation
    env:
      DOC_WEB_BASE_URL: https://tcdx-iso.tecdex.net
      DOC_API_BASE_URL: ${{ secrets.DOC_API_BASE_URL }}
      DOC_DEMO_PASSWORD: ${{ secrets.DOC_DEMO_PASSWORD }}
      DOC_ENABLE_WRITES: 'true'
      DOC_CAPTURE_DIR: artifacts/documentation/screenshots
      DOC_RESULTS_FILE: ../artifacts/documentation/nonconformities-remediation-results.json
      DOC_REPORT_DIR: ../artifacts/documentation/nonconformities-remediation-report

    steps:
      - uses: actions/checkout@v6
      - name: Guard demo-only writes
        shell: bash
        run: |
          set -euo pipefail
          test "$DOC_WEB_BASE_URL" = "https://tcdx-iso.tecdex.net"
          test -n "$DOC_API_BASE_URL"
          test -n "$DOC_DEMO_PASSWORD"
          test "$DOC_ENABLE_WRITES" = "true"
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run NC remediation capability
        working-directory: frontend
        run: npx playwright test tests/e2e/documentation-nonconformities-remediation.spec.ts --config=playwright.documentation-capture.config.ts
      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: tcdx-documentation-nonconformities-remediation-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            artifacts/documentation/
            frontend/test-results/
