name: Documentation demo enrichment

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/documentation-demo-enrichment.yml'
      - 'frontend/tests/e2e/documentation-demo-enrichment.spec.ts'
      - 'frontend/playwright.documentation-capture.config.ts'

permissions:
  contents: read

concurrency:
  group: documentation-demo-enrichment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  enrichment:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: documentation
    env:
      DOC_WEB_BASE_URL: https://tcdx-iso.tecdex.net
      DOC_API_BASE_URL: ${{ secrets.DOC_API_BASE_URL }}
      DOC_DEMO_PASSWORD: ${{ secrets.DOC_DEMO_PASSWORD }}
      DOC_ENABLE_WRITES: 'true'
      DOC_CAPTURE_DIR: artifacts/documentation/screenshots
      DOC_RESULTS_FILE: ../artifacts/documentation/demo-enrichment-results.json
      DOC_REPORT_DIR: ../artifacts/documentation/demo-enrichment-report
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Seed measurable demo data and capture before-after
        working-directory: frontend
        run: npx playwright test tests/e2e/documentation-demo-enrichment.spec.ts --config=playwright.documentation-capture.config.ts
      - name: Upload enrichment evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: tcdx-documentation-demo-enrichment-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            artifacts/documentation/
            frontend/test-results/
