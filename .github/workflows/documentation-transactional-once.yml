name: Documentation transactional baseline

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/documentation-transactional-once.yml'

permissions:
  contents: read

concurrency:
  group: documentation-transactional-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  transactional:
    name: Create guarded DOC baseline and capture forms
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: documentation
    env:
      DOC_WEB_BASE_URL: https://tcdx-iso.tecdex.net
      DOC_API_BASE_URL: ${{ secrets.DOC_API_BASE_URL }}
      DOC_DEMO_PASSWORD: ${{ secrets.DOC_DEMO_PASSWORD }}
      DOC_ENABLE_WRITES: 'true'
      DOC_CAPTURE_DIR: artifacts/documentation/screenshots
      DOC_RESULTS_FILE: ../artifacts/documentation/transactional-results.json
      DOC_REPORT_DIR: ../artifacts/documentation/transactional-report

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Guard production demo-only transaction
        shell: bash
        run: |
          set -euo pipefail
          test "$DOC_WEB_BASE_URL" = "https://tcdx-iso.tecdex.net"
          test -n "$DOC_API_BASE_URL"
          test -n "$DOC_DEMO_PASSWORD"
          test "$DOC_ENABLE_WRITES" = "true"
          echo "Transactional run restricted in test code to admin.demo9001/admin.demo27001/admin.demoisos and DOC-* records."

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Create DOC baseline and capture transactional forms
        working-directory: frontend
        run: npx playwright test tests/e2e/documentation-transactional.spec.ts --config=playwright.documentation-capture.config.ts

      - name: Upload transactional evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: tcdx-documentation-transactional-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            artifacts/documentation/
            frontend/test-results/
