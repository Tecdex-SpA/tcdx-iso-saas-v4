name: Phase 5 C2H Report Policy

on:
  push:
    branches:
      - fix/phase5-c2h-report-policy
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply export catalog single-flight patch
        run: node scripts/phase5-c2h/apply-report-catalog-singleflight-patch.js

      - name: Validate backend rate-limit tests
        run: |
          node -c backend/src/middleware/authenticatedRateLimit.middleware.js
          node backend/src/middleware/authenticatedRateLimit.middleware.test.js

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
          npm run build

      - name: Commit generated page integration
        run: |
          if git diff --quiet -- frontend/src/app/exportes/page.tsx; then
            echo "No generated changes required."
            exit 0
          fi

          branch_name="${{ github.event.pull_request.head.ref || github.ref_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/exportes/page.tsx
          git commit -m "fix(exportes): reuse report catalog bootstrap across locale hydration"
          git pull --rebase origin "${branch_name}"
          git push origin "HEAD:${branch_name}"
