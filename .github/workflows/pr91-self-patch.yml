name: PR91 no-hardcode reconciliation patch

on:
  push:
    branches:
      - fix/pre-ui-control-risk-maturity-reconciliation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pre-ui-control-risk-maturity-reconciliation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply targeted no-hardcode patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          resolver = Path('backend/src/services/math-governance/sourceResolver.service.js')
          text = resolver.read_text()

          old = """function validRiskAxis(value) {
            const parsed = number(value);
            return Number.isInteger(parsed) && parsed >= 1 && parsed <= 5 ? parsed : null;
          }
          """
          new = """function validRiskAxis(value) {
            const parsed = number(value);
            return parsed !== null && Number.isFinite(parsed) ? parsed : null;
          }
          """
          if old not in text:
              raise SystemExit('validRiskAxis block not found')
          text = text.replace(old, new, 1)

          start = text.index('function maturityPortfolio(rows = []) {')
          end = text.index('\nfunction safeTimestampExpression', start)
          new_maturity = """function maturityPortfolio(rows = []) {
            const usableRows = [];
            const exclusions = [];
            const levels = [];
            rows.forEach((row, index) => {
              const sourceRecord = row.id || row.source_entity_id || `row-${index}`;
              let level = number(row.level ?? row.maturity_level ?? row.numeric_value ?? row.value_numeric);
              if (level === null) {
                const sourceScore = number(row.source_score);
                const sourceMin = number(row.source_min);
                const sourceMax = number(row.source_max);
                const targetMin = number(row.target_min);
                const targetMax = number(row.target_max);
                const hasScale = [sourceScore, sourceMin, sourceMax, targetMin, targetMax].every((value) => value !== null);
                if (!hasScale || sourceMax === sourceMin) {
                  exclusions.push({
                    code: 'maturity_scale_configuration_missing',
                    field: 'metadata.score_min|score_max|maturity_min|maturity_max',
                    source_record: sourceRecord,
                    physical_source: row.__physical_source || null,
                    reason: 'F5_5_MATURITY no convierte scores sin una escala persistida completa en metadata; no se infieren equivalencias numéricas.',
                  });
                  return;
                }
                level = targetMin + (((sourceScore - sourceMin) / (sourceMax - sourceMin)) * (targetMax - targetMin));
              }
              if (!Number.isFinite(level)) {
                exclusions.push({ code: 'maturity_level_missing_or_invalid', field: 'level|maturity_level|numeric_value|value_numeric', source_record: sourceRecord, physical_source: row.__physical_source || null, reason: 'F5_5_MATURITY requiere un nivel numérico persistido o una conversión gobernada por metadata.' });
                return;
              }
              levels.push({ level, weight: number(row.weight, 1) });
              usableRows.push(row);
            });
            return { input: { levels }, usableRows, exclusions };
          }
          """
          text = text[:start] + new_maturity + text[end:]

          old_sql = """              CASE
                WHEN NULLIF(to_jsonb(e)->>'level','')::numeric BETWEEN 0 AND 5 THEN NULLIF(to_jsonb(e)->>'level','')::numeric
                WHEN NULLIF(to_jsonb(e)->>'maturity_level','')::numeric BETWEEN 0 AND 5 THEN NULLIF(to_jsonb(e)->>'maturity_level','')::numeric
                WHEN NULLIF(to_jsonb(e)->>'score','')::numeric BETWEEN 0 AND 100 THEN NULLIF(to_jsonb(e)->>'score','')::numeric / 20.0
                ELSE NULL
              END AS level,
              COALESCE(NULLIF(to_jsonb(e)->>'weight','')::numeric,1) AS weight,"""
          new_sql = """              COALESCE(NULLIF(to_jsonb(e)->>'level','')::numeric,NULLIF(to_jsonb(e)->>'maturity_level','')::numeric) AS level,
              NULLIF(to_jsonb(e)->>'score','')::numeric AS source_score,
              COALESCE(NULLIF(to_jsonb(e)->'metadata'->>'source_min','')::numeric,NULLIF(to_jsonb(e)->'metadata'->>'score_min','')::numeric) AS source_min,
              COALESCE(NULLIF(to_jsonb(e)->'metadata'->>'source_max','')::numeric,NULLIF(to_jsonb(e)->'metadata'->>'score_max','')::numeric) AS source_max,
              COALESCE(NULLIF(to_jsonb(e)->'metadata'->>'target_min','')::numeric,NULLIF(to_jsonb(e)->'metadata'->>'maturity_min','')::numeric) AS target_min,
              COALESCE(NULLIF(to_jsonb(e)->'metadata'->>'target_max','')::numeric,NULLIF(to_jsonb(e)->'metadata'->>'maturity_max','')::numeric) AS target_max,
              COALESCE(NULLIF(to_jsonb(e)->>'weight','')::numeric,1) AS weight,"""
          if old_sql not in text:
              raise SystemExit('maturity SQL block not found')
          text = text.replace(old_sql, new_sql, 1)

          old_grc = "COALESCE(NULLIF(to_jsonb(gm)->>'level','')::numeric,NULLIF(to_jsonb(gm)->>'score','')::numeric,NULLIF(to_jsonb(gm)->>'numeric_value','')::numeric,NULLIF(to_jsonb(gm)->>'value_numeric','')::numeric) AS level,"
          new_grc = "COALESCE(NULLIF(to_jsonb(gm)->>'level','')::numeric,NULLIF(to_jsonb(gm)->>'maturity_level','')::numeric,NULLIF(to_jsonb(gm)->>'numeric_value','')::numeric,NULLIF(to_jsonb(gm)->>'value_numeric','')::numeric) AS level,"
          if old_grc not in text:
              raise SystemExit('grc maturity mapping not found')
          text = text.replace(old_grc, new_grc, 1)

          text = text.replace('por no cumplir el contrato de ejes 1..5; las exclusiones permanecen auditables.', 'por no contener ejes numéricos utilizables; las exclusiones permanecen auditables.')
          resolver.write_text(text)

          contracts = Path('backend/src/services/math-governance/sourceContracts.service.js')
          ctext = contracts.read_text()
          ctext = ctext.replace("limitations: 'RISK-INHERENT calcula el promedio aritmetico del portafolio de riesgos utilizables del tenant; excluye filas sin probabilidad/likelihood o impacto validos 1..5, no usa rows[0], no deduplica por titulo y no cruza tenants.'", "limitations: 'RISK-INHERENT calcula el promedio aritmetico del portafolio de riesgos utilizables del tenant; excluye filas sin probabilidad/likelihood o impacto numéricos, no impone una escala de cliente en código, no usa rows[0], no deduplica por titulo y no cruza tenants.'")
          ctext = ctext.replace("columns: ['tenant_id','score','numeric_value','weight','evaluated_at','measured_at','status','metadata'], required_fields: ['id','tenant_id'],\n    variable_map: { levels: 'rows[{level|score|numeric_value,weight}]' },", "columns: ['tenant_id','level','maturity_level','score','numeric_value','weight','evaluated_at','measured_at','status','metadata'], required_fields: ['id','tenant_id'],\n    variable_map: { levels: 'rows[{level|maturity_level|numeric_value,weight}]', score_conversion: 'metadata{source_min,source_max,target_min,target_max}' },")
          ctext = ctext.replace("limitations: 'Prioriza evaluaciones publicadas y usa mediciones de madurez como fallback; no infiere niveles sin datos.'", "limitations: 'Prioriza niveles de madurez persistidos. Un score solo se convierte cuando la fila aporta en metadata la escala origen y destino completa; sin configuración persistida queda no calculable y nunca se infiere una equivalencia.'")
          contracts.write_text(ctext)

          test = Path('backend/src/services/math-governance/phase5Package3.test.js')
          t = test.read_text()
          old_test = """  let maturitySqlChecked = false;
            const maturityClient = { async query(sql, params) {
              if (sql.includes('to_regclass')) return fakeTableExists(params, ['survey_evaluations']);
              if (sql.includes('FROM survey_evaluations e')) {
                maturitySqlChecked = sql.includes(\"score','')::numeric / 20.0\");
                return { rows: [{ id: 'maturity-a', tenant_id: 'tenant-a', level: 4.2, weight: 1, status: 'confirmed', __event_time: '2026-08-10T12:00:00Z' }] };
              }
              throw new Error(`unexpected maturity query: ${sql}`);
            } };
            const maturitySource = await resolveFormulaSource({ client: maturityClient, tenantId: 'tenant-a', formulaCode: 'F5_5_MATURITY', period: { start: '2026-08-01T00:00:00Z', end: '2026-08-13T23:59:59Z' } });
            assert.strictEqual(maturitySqlChecked, true, 'survey evaluation percentage must be explicitly normalized to maturity 0..5');
            assert.deepStrictEqual(maturitySource.formula_input, { levels: [{ level: 4.2, weight: 1 }] });
            assert.strictEqual(executeFormula('F5_5_MATURITY', maturitySource.formula_input).value, 4.2);"""
          new_test = """  let maturitySqlChecked = false;
            const maturityClient = { async query(sql, params) {
              if (sql.includes('to_regclass')) return fakeTableExists(params, ['survey_evaluations']);
              if (sql.includes('FROM survey_evaluations e')) {
                maturitySqlChecked = sql.includes(\"metadata'->>'source_max'\") && !sql.includes('/ 20.0') && !sql.includes('BETWEEN 0 AND 5');
                return { rows: [{ id: 'maturity-a', tenant_id: 'tenant-a', level: null, source_score: 84, source_min: 0, source_max: 100, target_min: 0, target_max: 5, weight: 1, status: 'confirmed', __event_time: '2026-08-10T12:00:00Z' }] };
              }
              throw new Error(`unexpected maturity query: ${sql}`);
            } };
            const maturitySource = await resolveFormulaSource({ client: maturityClient, tenantId: 'tenant-a', formulaCode: 'F5_5_MATURITY', period: { start: '2026-08-01T00:00:00Z', end: '2026-08-13T23:59:59Z' } });
            assert.strictEqual(maturitySqlChecked, true, 'survey maturity conversion must use persisted scale metadata and no runtime scale constants');
            assert.deepStrictEqual(maturitySource.formula_input, { levels: [{ level: 4.2, weight: 1 }] });
            assert.strictEqual(executeFormula('F5_5_MATURITY', maturitySource.formula_input).value, 4.2);

            const maturityWithoutScaleClient = { async query(sql, params) {
              if (sql.includes('to_regclass')) return fakeTableExists(params, ['survey_evaluations']);
              if (sql.includes('FROM survey_evaluations e')) return { rows: [{ id: 'maturity-b', tenant_id: 'tenant-b', level: null, source_score: 84, source_min: null, source_max: null, target_min: null, target_max: null, weight: 1, status: 'confirmed', __event_time: '2026-08-10T12:00:00Z' }] };
              throw new Error(`unexpected maturity query: ${sql}`);
            } };
            const maturityWithoutScale = await resolveFormulaSource({ client: maturityWithoutScaleClient, tenantId: 'tenant-b', formulaCode: 'F5_5_MATURITY', period: { start: '2026-08-01T00:00:00Z', end: '2026-08-13T23:59:59Z' } });
            assert.strictEqual(maturityWithoutScale.status, 'empty_dataset');
            assert.ok(maturityWithoutScale.exclusions.some((item) => item.code === 'maturity_scale_configuration_missing'));"""
          if old_test not in t:
              raise SystemExit('maturity test block not found')
          t = t.replace(old_test, new_test, 1)
          test.write_text(t)

          workflow = Path('.github/workflows/pr91-self-patch.yml')
          workflow.unlink()
          PY
      - name: Commit targeted patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/src/services/math-governance/sourceResolver.service.js backend/src/services/math-governance/sourceContracts.service.js backend/src/services/math-governance/phase5Package3.test.js .github/workflows/pr91-self-patch.yml
          git diff --cached --check
          git commit -m "fix(metrics): remove tenant scale assumptions from reconciliation"
          git push origin HEAD:fix/pre-ui-control-risk-maturity-reconciliation
