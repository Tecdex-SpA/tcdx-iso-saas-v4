name: PR91 no-hardcode reconciliation patch

on:
  push:
    branches:
      - fix/pre-ui-control-risk-maturity-reconciliation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pre-ui-control-risk-maturity-reconciliation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply targeted no-hardcode patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label}: expected source fragment not found')
              return text.replace(old, new, 1)

          resolver = Path('backend/src/services/math-governance/sourceResolver.service.js')
          text = resolver.read_text()

          text, n = re.subn(
              r"function validRiskAxis\(value\) \{\s*const parsed = number\(value\);\s*return Number\.isInteger\(parsed\) && parsed >= 1 && parsed <= 5 \? parsed : null;\s*\}",
              "function validRiskAxis(value) {\n  const parsed = number(value);\n  return parsed !== null && Number.isFinite(parsed) ? parsed : null;\n}",
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit('validRiskAxis: replacement count != 1')

          start = text.index('function maturityPortfolio(rows = []) {')
          end = text.index('\nfunction safeTimestampExpression', start)
          new_maturity = """function maturityPortfolio(rows = []) {
            const usableRows = [];
            const exclusions = [];
            const levels = [];
            rows.forEach((row, index) => {
              const sourceRecord = row.id || row.source_entity_id || `row-${index}`;
              let level = number(row.level ?? row.maturity_level ?? row.numeric_value ?? row.value_numeric);
              if (level === null) {
                const sourceScore = number(row.source_score);
                const sourceMin = number(row.source_min);
                const sourceMax = number(row.source_max);
                const targetMin = number(row.target_min);
                const targetMax = number(row.target_max);
                const hasScale = [sourceScore, sourceMin, sourceMax, targetMin, targetMax].every((value) => value !== null);
                if (!hasScale || sourceMax === sourceMin) {
                  exclusions.push({
                    code: 'maturity_scale_configuration_missing',
                    field: 'metadata.source_min|source_max|target_min|target_max',
                    source_record: sourceRecord,
                    physical_source: row.__physical_source || null,
                    reason: 'F5_5_MATURITY no convierte scores sin una escala persistida completa; no se infieren equivalencias numéricas.',
                  });
                  return;
                }
                level = targetMin + (((sourceScore - sourceMin) / (sourceMax - sourceMin)) * (targetMax - targetMin));
              }
              if (!Number.isFinite(level)) {
                exclusions.push({
                  code: 'maturity_level_missing_or_invalid',
                  field: 'level|maturity_level|numeric_value|value_numeric',
                  source_record: sourceRecord,
                  physical_source: row.__physical_source || null,
                  reason: 'F5_5_MATURITY requiere un nivel numérico persistido o una conversión gobernada por metadata.',
                });
                return;
              }
              levels.push({ level, weight: number(row.weight, 1) });
              usableRows.push(row);
            });
            return { input: { levels }, usableRows, exclusions };
          }
          """
          text = text[:start] + new_maturity + text[end:]

          sql_start = text.index("async function queryMaturity(client, tenantId, period) {")
          sql_end = text.index("\nasync function queryIncidents", sql_start)
          maturity_query = text[sql_start:sql_end]
          maturity_query, n = re.subn(
              r"CASE\s+WHEN NULLIF\(to_jsonb\(e\)->>'level',''\)::numeric BETWEEN 0 AND 5 THEN NULLIF\(to_jsonb\(e\)->>'level',''\)::numeric\s+WHEN NULLIF\(to_jsonb\(e\)->>'maturity_level',''\)::numeric BETWEEN 0 AND 5 THEN NULLIF\(to_jsonb\(e\)->>'maturity_level',''\)::numeric\s+WHEN NULLIF\(to_jsonb\(e\)->>'score',''\)::numeric BETWEEN 0 AND 100 THEN NULLIF\(to_jsonb\(e\)->>'score',''\)::numeric / 20\.0\s+ELSE NULL\s+END AS level,",
              "COALESCE(NULLIF(to_jsonb(e)->>'level','')::numeric,NULLIF(to_jsonb(e)->>'maturity_level','')::numeric) AS level,\n              NULLIF(to_jsonb(e)->>'score','')::numeric AS source_score,\n              COALESCE(NULLIF(to_jsonb(e)->'metadata'->>'source_min','')::numeric,NULLIF(to_jsonb(e)->'metadata'->>'score_min','')::numeric) AS source_min,\n              COALESCE(NULLIF(to_jsonb(e)->'metadata'->>'source_max','')::numeric,NULLIF(to_jsonb(e)->'metadata'->>'score_max','')::numeric) AS source_max,\n              COALESCE(NULLIF(to_jsonb(e)->'metadata'->>'target_min','')::numeric,NULLIF(to_jsonb(e)->'metadata'->>'maturity_min','')::numeric) AS target_min,\n              COALESCE(NULLIF(to_jsonb(e)->'metadata'->>'target_max','')::numeric,NULLIF(to_jsonb(e)->'metadata'->>'maturity_max','')::numeric) AS target_max,",
              maturity_query,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('queryMaturity survey normalization: replacement count != 1')
          maturity_query = replace_once(
              maturity_query,
              "COALESCE(NULLIF(to_jsonb(gm)->>'level','')::numeric,NULLIF(to_jsonb(gm)->>'score','')::numeric,NULLIF(to_jsonb(gm)->>'numeric_value','')::numeric,NULLIF(to_jsonb(gm)->>'value_numeric','')::numeric) AS level,",
              "COALESCE(NULLIF(to_jsonb(gm)->>'level','')::numeric,NULLIF(to_jsonb(gm)->>'maturity_level','')::numeric,NULLIF(to_jsonb(gm)->>'numeric_value','')::numeric,NULLIF(to_jsonb(gm)->>'value_numeric','')::numeric) AS level,",
              'grc_metric_measurements maturity mapping',
          )
          text = text[:sql_start] + maturity_query + text[sql_end:]

          control_start = text.index("  if (formulaCode === 'F5_5_CONTROL_EFFECTIVENESS' && formulaRows.length) {")
          control_end = text.index("\n\n  let formulaCounts", control_start)
          new_control = """  if (formulaCode === 'F5_5_CONTROL_EFFECTIVENESS' && formulaRows.length) {
            const mappedDimensions = [formulaInput?.design, formulaInput?.implementation, formulaInput?.operation, formulaInput?.evidence];
            const dimensionFields = ['design_score', 'design_effectiveness', 'implementation_score', 'implementation_effectiveness', 'operation_score', 'operation_effectiveness', 'operating_effectiveness', 'evidence_score', 'evidence_effectiveness'];
            const hasAnyDimension = formulaRows.some((row) => dimensionFields.some((field) => number(row[field]) !== null));
            const aggregateScores = formulaRows.map((row) => ratio(row.score)).filter((value) => value !== null);
            if (mappedDimensions.every((value) => value === null) && !hasAnyDimension && aggregateScores.length) {
              formulaInput = { compositeScore: average(aggregateScores) };
              resolverWarnings.push('F5_5_CONTROL_EFFECTIVENESS usó el score compuesto oficial de assurance sin fabricar dimensiones D/I/O/E inexistentes.');
            }
          }"""
          text = text[:control_start] + new_control + text[control_end:]
          text = text.replace('por no cumplir el contrato de ejes 1..5; las exclusiones permanecen auditables.', 'por no contener ejes numéricos utilizables; las exclusiones permanecen auditables.')
          resolver.write_text(text)

          contracts = Path('backend/src/services/math-governance/sourceContracts.service.js')
          ctext = contracts.read_text()
          ctext = replace_once(
              ctext,
              "variable_map: { risks: 'rows[{source_record,probability|likelihood,impact,inherent_risk_score=probability*impact}]', aggregation_method: 'arithmetic_mean', probability: 'probability|likelihood', impact: 'impact', inherentRisk: 'mean(rows.probability*rows.impact)', controlEffectiveness: 'assurance_score/100', severity: 'severity', occurrence: 'occurrence', detection: 'detection' },",
              "variable_map: { risks: 'rows[{source_record,probability|likelihood,impact,inherent_risk_score=probability*impact}]', aggregation_method: 'arithmetic_mean', probability: 'probability|likelihood', impact: 'impact', inherentRisk: 'mean(rows.probability*rows.impact)', controlEffectiveness: 'assurance_score/100', severity: 'severity', occurrence: 'occurrence', detection: 'detection' },",
              'risk variable map',
          )
          ctext = ctext.replace(
              "limitations: 'RISK-INHERENT calcula el promedio aritmetico del portafolio de riesgos utilizables del tenant; excluye filas sin probabilidad/likelihood o impacto validos 1..5, no usa rows[0], no deduplica por titulo y no cruza tenants.'",
              "limitations: 'RISK-INHERENT calcula el promedio aritmetico del portafolio de riesgos utilizables del tenant; excluye filas sin probabilidad/likelihood o impacto numéricos, no impone una escala específica de cliente en código, no usa rows[0], no deduplica por titulo y no cruza tenants.'",
          )
          ctext = ctext.replace(
              "variable_map: { design: 'dimension.design|score/100', implementation: 'dimension.implementation|score/100', operation: 'dimension.operation|score/100', evidence: 'evidence_score|score/100', effectivenesses: 'rows.score/100' },",
              "variable_map: { design: 'dimension.design', implementation: 'dimension.implementation', operation: 'dimension.operation', evidence: 'evidence_score', compositeScore: 'mean(rows.score)/100', effectivenesses: 'rows.score/100' },",
          )
          ctext = ctext.replace(
              "limitations: 'Cuando no hay dimensiones separadas se usa el score oficial de assurance como medida compuesta declarada, conservando warning metodológico.'",
              "limitations: 'Cuando no hay dimensiones separadas, CONTROL-EFFECT usa directamente el score compuesto oficial persistido; nunca replica ese valor como dimensiones D/I/O/E inexistentes.'",
          )
          ctext = ctext.replace(
              "columns: ['tenant_id','score','numeric_value','weight','evaluated_at','measured_at','status','metadata'], required_fields: ['id','tenant_id'],\n    variable_map: { levels: 'rows[{level|score|numeric_value,weight}]' },",
              "columns: ['tenant_id','level','maturity_level','score','numeric_value','weight','evaluated_at','measured_at','status','metadata'], required_fields: ['id','tenant_id'],\n    variable_map: { levels: 'rows[{level|maturity_level|numeric_value,weight}]', score_conversion: 'metadata{source_min,source_max,target_min,target_max}' },",
          )
          ctext = ctext.replace(
              "limitations: 'Prioriza evaluaciones publicadas y usa mediciones de madurez como fallback; no infiere niveles sin datos.'",
              "limitations: 'Prioriza niveles de madurez persistidos. Un score sólo se convierte cuando metadata aporta la escala origen y destino completa; sin configuración persistida queda no calculable y nunca se infiere una equivalencia.'",
          )
          contracts.write_text(ctext)

          registry = Path('backend/src/services/math-governance/formulaRegistry.service.js')
          rtext = registry.read_text()
          old_formula = "['F5_5_CONTROL_EFFECTIVENESS','Efectividad de control','control','wd*D+wi*I+wo*O+we*E','weighted control dimensions', 'ratio', 4, [{name:'design'},{name:'implementation'},{name:'operation'},{name:'evidence'}], (i,d)=>output(d,controls.controlEffectiveness(i)), {design:.8,implementation:.7,operation:.9,evidence:.6}, .75],"
          new_formula = "['F5_5_CONTROL_EFFECTIVENESS','Efectividad de control','control','compositeScore OR wd*D+wi*I+wo*O+we*E','persisted composite assurance score or weighted published control dimensions', 'ratio', 4, [{name:'compositeScore',required:false},{name:'design',required:false},{name:'implementation',required:false},{name:'operation',required:false},{name:'evidence',required:false}], (i,d)=>{ if(i.compositeScore!==undefined&&i.compositeScore!==null)return output(d,Number(i.compositeScore),{method:'persisted_composite'}); const required=['design','implementation','operation','evidence']; if(required.some((key)=>i[key]===undefined||i[key]===null))throw new FormulaRegistryError('CONTROL_EFFECTIVENESS_INPUT_INCOMPLETE','Efectividad de control requiere compositeScore persistido o las cuatro dimensiones publicadas.'); return output(d,controls.controlEffectiveness(i),{method:'published_dimensions'}); }, {design:.8,implementation:.7,operation:.9,evidence:.6}, .75],"
          rtext = replace_once(rtext, old_formula, new_formula, 'control formula registry')
          registry.write_text(rtext)

          test = Path('backend/src/services/math-governance/phase5Package3.test.js')
          t = test.read_text()
          t = replace_once(
              t,
              "  assert.deepStrictEqual(controlSource.formula_input, { design: 0.8, implementation: 0.8, operation: 0.8, evidence: 0.8 });\n  assert.strictEqual(executeFormula('F5_5_CONTROL_EFFECTIVENESS', controlSource.formula_input).value, 0.8);\n  assert.ok(controlSource.warnings.some((warning) => String(warning).includes('score oficial agregado')));",
              "  assert.deepStrictEqual(controlSource.formula_input, { compositeScore: 0.8 });\n  assert.strictEqual(executeFormula('F5_5_CONTROL_EFFECTIVENESS', controlSource.formula_input).value, 0.8);\n  assert.ok(controlSource.warnings.some((warning) => String(warning).includes('score compuesto oficial')));\n  assert.ok(!Object.prototype.hasOwnProperty.call(controlSource.formula_input, 'design'));",
              'control reconciliation test',
          )
          maturity_start = t.index('  let maturitySqlChecked = false;')
          maturity_end = t.index('\n}', maturity_start)
          new_maturity_test = """  let maturitySqlChecked = false;
            const maturityClient = { async query(sql, params) {
              if (sql.includes('to_regclass')) return fakeTableExists(params, ['survey_evaluations']);
              if (sql.includes('FROM survey_evaluations e')) {
                maturitySqlChecked = sql.includes(\"metadata'->>'source_max'\") && !sql.includes('/ 20.0') && !sql.includes('BETWEEN 0 AND 5');
                return { rows: [{ id: 'maturity-a', tenant_id: 'tenant-a', level: null, source_score: 84, source_min: 0, source_max: 100, target_min: 0, target_max: 5, weight: 1, status: 'confirmed', __event_time: '2026-08-10T12:00:00Z' }] };
              }
              throw new Error(`unexpected maturity query: ${sql}`);
            } };
            const maturitySource = await resolveFormulaSource({ client: maturityClient, tenantId: 'tenant-a', formulaCode: 'F5_5_MATURITY', period: { start: '2026-08-01T00:00:00Z', end: '2026-08-13T23:59:59Z' } });
            assert.strictEqual(maturitySqlChecked, true, 'survey maturity conversion must use persisted scale metadata and no runtime scale constants');
            assert.deepStrictEqual(maturitySource.formula_input, { levels: [{ level: 4.2, weight: 1 }] });
            assert.strictEqual(executeFormula('F5_5_MATURITY', maturitySource.formula_input).value, 4.2);

            const maturityWithoutScaleClient = { async query(sql, params) {
              if (sql.includes('to_regclass')) return fakeTableExists(params, ['survey_evaluations']);
              if (sql.includes('FROM survey_evaluations e')) return { rows: [{ id: 'maturity-b', tenant_id: 'tenant-b', level: null, source_score: 84, source_min: null, source_max: null, target_min: null, target_max: null, weight: 1, status: 'confirmed', __event_time: '2026-08-10T12:00:00Z' }] };
              throw new Error(`unexpected maturity query: ${sql}`);
            } };
            const maturityWithoutScale = await resolveFormulaSource({ client: maturityWithoutScaleClient, tenantId: 'tenant-b', formulaCode: 'F5_5_MATURITY', period: { start: '2026-08-01T00:00:00Z', end: '2026-08-13T23:59:59Z' } });
            assert.strictEqual(maturityWithoutScale.status, 'empty_dataset');
            assert.ok(maturityWithoutScale.exclusions.some((item) => item.code === 'maturity_scale_configuration_missing'));"""
          t = t[:maturity_start] + new_maturity_test + t[maturity_end:]
          test.write_text(t)

          Path('.github/workflows/pr91-self-patch.yml').unlink()
          PY
      - name: Verify targeted invariants
        shell: bash
        run: |
          ! grep -n "score','')::numeric / 20.0" backend/src/services/math-governance/sourceResolver.service.js
          ! grep -n "BETWEEN 0 AND 5" backend/src/services/math-governance/sourceResolver.service.js
          grep -n "compositeScore" backend/src/services/math-governance/sourceResolver.service.js backend/src/services/math-governance/formulaRegistry.service.js
          grep -n "raw_population_size" backend/src/services/math-governance/sourceResolver.service.js
          git diff --check
      - name: Commit targeted patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/src/services/math-governance/sourceResolver.service.js backend/src/services/math-governance/sourceContracts.service.js backend/src/services/math-governance/formulaRegistry.service.js backend/src/services/math-governance/phase5Package3.test.js .github/workflows/pr91-self-patch.yml
          git diff --cached --check
          git commit -m "fix(metrics): remove tenant scale assumptions from reconciliation"
          git push origin HEAD:fix/pre-ui-control-risk-maturity-reconciliation
