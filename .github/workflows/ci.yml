name: CI

on:
  pull_request:

jobs:
  validate:
    name: Validate backend and frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Git diff hygiene
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Backend tests
        working-directory: backend
        run: npm test

      - name: Backend syntax check
        working-directory: backend
        run: npm run check

      - name: Phase 1 contracts
        run: npm run phase1:contracts:check

      - name: Phase 1 disposable PostgreSQL migration
        run: npm run phase1:migration-check

      - name: Phase 1 permissions
        run: npm run phase1:permissions-check

      - name: Phase 1 tenant isolation contracts
        run: npm run phase1:tenant-check

      - name: Phase 1 script validation
        run: npm run phase1:scripts-check

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Discover Phase 1 Playwright tests
        run: npm run phase1:e2e:discovery

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend type check
        working-directory: frontend
        run: npm run check

      - name: Frontend build
        working-directory: frontend
        run: npm run build
