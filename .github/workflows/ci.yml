name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate backend and frontend
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Git diff hygiene
        run: |
          BASE_REF="${{ github.event.pull_request.base.sha || 'origin/main' }}"
          git diff --check "$BASE_REF...HEAD"

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Backend tests
        working-directory: backend
        run: npm test

      - name: Backend syntax check
        working-directory: backend
        run: npm run check

      - name: Demo tenant production contracts and disposable PostgreSQL
        run: |
          npm run demo:validate
          npm run demo:postgres-check

      - name: Phase 5 migration syntax and checksum
        run: |
          node --check scripts/phase5/apply-phase5-migration.js
          node scripts/phase5/apply-phase5-migration.js --checksum

      - name: Phase 5.5 source bindings and equivalence
        run: npm run phase5-5:source-binding-check

      - name: Phase 5.5 PostgreSQL source adapters
        run: bash scripts/phase5-5/check-source-adapters-postgres-ci.sh

      - name: Phase 5.5 formula snapshot contract
        run: bash scripts/phase5-5/check-50-formulas-snapshot-postgres-ci.sh

      - name: Phase 5.5 production acceptance contract
        run: node scripts/phase5-5/check-production-acceptance-contract.js

      - name: Phase 5 functional closure gate
        run: npm run phase5:functional-closure

      - name: Phase 5-C2 semantic contracts and security
        run: |
          npm run phase5-c2:contracts-check
          npm run phase5-c2:security-check
          npm run phase5-c2:scripts-check
          npm run phase5-c2:migration:checksum
          npm run phase5-c2:unit

      - name: Phase 5-C2 disposable PostgreSQL integration
        run: npm run phase5-c2:postgres

      - name: Phase 5-C3 contracts, security, checksum and unit
        run: |
          npm run phase5-c3:contracts-check
          npm run phase5-c3:security-check
          npm run phase5-c3:migration:checksum
          npm run phase5-c3:unit

      - name: Phase 5-C3 disposable PostgreSQL integration
        run: npm run phase5-c3:postgres

      - name: Phase 1 contracts
        run: npm run phase1:contracts:check

      - name: Phase 1 disposable PostgreSQL migration
        run: npm run phase1:migration-check

      - name: Phase 1 PostgreSQL integration
        run: npm run phase1:postgres-integration

      - name: Phase 1 permissions
        run: npm run phase1:permissions-check

      - name: Phase 1 tenant isolation contracts
        run: npm run phase1:tenant-check

      - name: Phase 1 script validation
        run: npm run phase1:scripts-check

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Discover Phase 1 Playwright tests
        run: npm run phase1:e2e:discovery

      - name: Discover Phase 5-C2 Playwright tests
        working-directory: frontend
        run: npx playwright test --config=playwright.phase5-c2.config.ts --list

      - name: Validate Phase 1 Playwright contracts
        run: node scripts/phase1/check-phase1-e2e-contracts.js

      - name: Phase 5-C3 script and Playwright discovery validation
        run: npm run phase5-c3:scripts-check

      - name: Frontend Phase 1 UI contracts
        working-directory: frontend
        run: npm test

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend type check
        working-directory: frontend
        run: npm run check

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Install Chromium for Phase 5-C2/C3 E2E
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Phase 5-C2 browser E2E
        run: npm run phase5-c2:browser-e2e

      - name: Phase 5-C3 browser E2E
        run: npm run phase5-c3:browser-e2e

      - name: Phase 5.5 browser E2E and cross-view consistency
        run: |
          npm run phase5-5:browser-e2e
          npm run phase5-5:full-e2e
          npm run phase5-5:cross-view-consistency

      - name: Phase 5.5 report and export artifact validation
        run: npm run phase5-5:artifact-validation
